name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name JhFastYT --collect-all customtkinter --collect-all webview --collect-all clr_loader --hidden-import clr src/app.py
      - run: Compress-Archive -Path dist/JhFastYT/* -DestinationPath JhFastYT-win-x64.zip
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DRepo=${{ github.repository }}" install\setup.iss'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            JhFastYT-win-x64.zip
            dist-setup/JhFastYT-Setup.exe
